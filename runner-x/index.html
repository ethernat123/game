 else if(t==='crate'){bx(g,woodM,0,.7,0,1.6,1.4,1.2,1);for(const y of[.25,.95])bx(g,woodD,0,y,.61,1.65,.1,.02);bx(g,woodD,0,.7,.61,.1,1.4,.02);d=1.2}
 else if(t==='mov'){bx(g,R(carM),0,.6,0,4.1,.7,1.8,1);bx(g,glass,0,1.2,0,2.2,.5,1.6);for(const a of[-1,1])for(const b of[-1,1])bx(g,tire,a*1.35,.32,b*.9,.64,.64,.26);d=2}
 else{bx(g,R(carM),0,1.7,.6,2.1,2.5,4.2,1);bx(g,R(carM),0,1.1,-2.1,2,1.8,1.5,1);bx(g,glass,0,1.5,-2.86,1.7,.7,.05);for(const x of[-.7,.7])bx(g,red,x,.7,2.72,.3,.2,.04);for(const a of[-1,1])for(const b of[-1.9,1.6])bx(g,tire,a*1.05,.45,b,.25,.9,.9,1);d=5.6}
 g.position.set(l*3,0,z);if(t==='mov'){const dir=R([-1,1]);g.position.x=-dir*9.5;vx=dir*(5+rnd()*3)}scene.add(g);obs.push({g,t,d,vx})}
// ---- paralar: altın, mavi elmas, mıknatıs
function pk(l,z,y=1.25,k='c'){const m=new THREE.Group();
 if(k==='c'){const f=new THREE.Group();f.rotation.x=Math.PI/2;M(f,UC,gold,0,0,0,.36,.09,.36);M(f,UC,goldL,0,0,0,.26,.11,.26);m.add(f)}
 else if(k==='g')M(m,UO,gem,0,0,0,1,1.3,1);
 else{const u=new THREE.Mesh(new THREE.TorusGeometry(.3,.1,8,14,Math.PI),red);u.rotation.z=Math.PI;m.add(u);for(const x of[-.3,.3])bx(m,white,x,.0,0,.2,.16,.2)}
 m.position.set(l*3,y,z);scene.add(m);picks.push({m,k})}
const line=(l,z,n,y=1.25,g=2.4)=>{for(let i=0;i<n;i++)pk(l,z-i*g,y)};
const arc=(l,z)=>{const s=speed*.7;for(let k=0;k<7;k++)pk(l,z+s/2-s*k/6,1.2+1.55*Math.sin(Math.PI*k/6))};
const PAT=[
 z=>{const l=rl();ob(l,z,'low');arc(l,z);return speed*.4+4},
 z=>{const l=rl();ob(l,z,'over');line(l,z+3,5,1,2.2);return 8},
 z=>{const l=rl();ob(l,z,'blk');for(let o=-1;o<=1;o++)if(o!==l)line(o,z+2,5);return 8},
 z=>{let l=rl();for(let i=0;i<3;i++){ob(l,z-i*11,'low');line(l===0?(i%2?1:-1):0,z-i*11+2,3,1.25,2);l=cl(l+R([-1,1]))}return 33},
 z=>{const g=rl();for(let o=-1;o<=1;o++)if(o!==g)ob(o,z,rnd()<.5?'blk':'low');line(g,z+3,6,1.25,2.2);return 9},
 z=>{const l=rl(),s=speed*.85+4;ob(l,z,'low');arc(l,z);ob(l,z-s,'over');line(l,z-s+2,4,1,2);return s+7},
 z=>{for(let k=0;k<12;k++)pk(cl(Math.round(Math.sin(k*.55)*1.3)),z-k*2.6);return 32},
 z=>{const l=rl(),o=cl(l+R([-1,1]));ob(o,z,'blk');line(l,z+3,5);pk(l,z-9.4,1.25,'g');return 12},
 z=>{for(let i=0;i<3;i++)for(let o=-1;o<=1;o++)pk(o,z-i*2.4);return 8}];
PAT.push(
 z=>{const l=rl();ob(l,z,'crate');arc(l,z);return speed*.35+4},
 z=>{ob(rl(),z,'mov');line(rl(),z+2,5);return 10},
 z=>{const l=rl();ob(l,z,'over');ob(l,z-12,'low');ob(l,z-24,'over');line(l,z+1.5,3,1,1.5);line(l,z-22.5,3,1,1.5);return 30},
 z=>{for(let o=-1;o<=1;o++){ob(o,z,'over');line(o,z+3,3,1,2)}return 8});
let lane=0,score=0,coins=0,best=+(localStorage.runnerXBest||0),speed=17,active=false,paused=false,dead=false,front=-35,elapsed=0,vy=0,dbl=false,fl=0,land=0,slide=0,slideQ=false,magT=0,combo=0,lastPick=0,ph=0;
$('best').textContent=best;$('menuBest').textContent=best;
const hud=$('hud'),menu=$('menu'),over=$('over');
let ac;function sfx(f,d=.08,ty='triangle'){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let tt;const say=(t,ms)=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);if(ms)tt=setTimeout(()=>e.style.display='none',ms)};
const parts=[];for(let i=0;i<36;i++){const m=new THREE.Mesh(UB,goldP);m.scale.setScalar(.12);m.visible=false;scene.add(m);parts.push({m,v:new THREE.Vector3(),l:0})}
function burst(p,n=7){let c=0;for(const q of parts)if(q.l<=0){q.l=.5;q.m.visible=true;q.m.position.copy(p);q.v.set((rnd()-.5)*5,rnd()*4+1,(rnd()-.5)*5);if(++c>=n)break}}
function updateHud(){$('score').textContent=Math.floor(score);$('coins').textContent=coins;$('best').textContent=best}
function clearObjects(){for(const a of obs)scene.remove(a.g);for(const c of picks)scene.remove(c.m);obs.length=0;picks.length=0}
function start(){clearObjects();lane=0;score=0;coins=0;speed=17;front=-35;elapsed=0;vy=0;dbl=false;fl=0;slide=0;slideQ=false;magT=0;combo=0;dead=false;player.position.set(0,0,3);pv.rotation.set(0,0,0);active=true;paused=false;dayNight(T.fix??0);sfx(600,.05);menu.style.display='none';over.style.display='none';hud.style.display='block';say(I('tip'),2500);updateHud()}
function end(){active=false;dead=true;slide=0;slideQ=false;vy=0;player.position.y=0;sfx(130,.5,'sawtooth');hud.style.display='none';ld.w+=coins;save();$('finalScore').textContent=Math.floor(score);$('finalCoins').textContent=coins;if(score>best){best=Math.floor(score);localStorage.runnerXBest=best}$('menuBest').textContent=best;$('menuW').textContent=ld.w;setTimeout(()=>{dead=false;over.style.display='flex'},750)}
function pause(){if(!active)return;paused=!paused;paused?say(I('paused')):$('toast').style.display='none'}
function move(d){if(!active||paused)return;lane=cl(lane+d)}
function jumpUp(){if(!active||paused)return;if(player.position.y<=0){vy=10;sfx(400,.08)}else if(!dbl){vy=8.5;dbl=true;fl=.01;sfx(560,.1)}}
function slideDown(){if(!active||paused)return;if(player.position.y>0){vy=-18;slideQ=true}else slide=.8}
function action(k){if(k==='arrowleft'||k==='a')move(-1);if(k==='arrowright'||k==='d')move(1);if(k==='arrowup'||k==='w'||k===' ')jumpUp();if(k==='arrowdown'||k==='s')slideDown()}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Escape')pause();else action(e.key.toLowerCase())});
let tx=0,ty=0;renderer.domElement.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jumpUp();else slideDown()}},{passive:true});
$('start').onclick=start;$('again').onclick=start;$('home').onclick=()=>{over.style.display='none';menu.style.display='flex';$('menuBest').textContent=best};$('pause').onclick=pause;$('langBtn').onclick=()=>{lang=lang==='tr'?'en':'tr';try{localStorage.rxL=JSON.stringify(lang)}catch(e){}applyLang();if($('shop').style.display==='flex')shop()};
let tab='c';
function shop(){const A=tab==='c'?CH:CT,Lst=$('shopList');$('wallet').textContent=ld.w;Lst.innerHTML='';A.forEach((it,i)=>{const own=ld.o[tab].includes(i),sel=ld.s[tab]===i,r=document.createElement('div'),b=document.createElement('button');r.className='row';r.innerHTML='<span>'+nm(it)+'</span>';b.className='secondary';b.style.margin=0;b.textContent=sel?I('sel'):own?I('pick'):'🪙 '+it.p;b.disabled=sel;b.onclick=()=>{if(!own){if(ld.w<it.p){b.textContent=I('poor');return}ld.w-=it.p;ld.o[tab].push(i)}ld.s[tab]=i;save();tab==='c'?buildPlayer():applyTheme();shop()};r.appendChild(b);Lst.appendChild(r)})}
$('shopBtn').onclick=()=>{menu.style.display='none';$('shop').style.display='flex';shop()};$('shopBack').onclick=()=>{$('shop').style.display='none';menu.style.display='flex';$('menuW').textContent=ld.w};$('tabC').onclick=()=>{tab='c';shop()};$('tabT').onclick=()=>{tab='t';shop()};$('menuW').textContent=ld.w;
let last=performance.now();
const set=(l,a,b)=>{l[0].rotation.x=a;l[1].rotation.x=b};
function applyTheme(){T=CT[ld.s.t];gnd.color.set(T.g);sand.color.set(T.side);sea.color.set(T.sea);for(const c of chunks)build(c);dayNight(T.fix??(active?(elapsed/80)%1:0))}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;
 const run=active&&!paused,v=dead?0:run?speed:(active?0:6),p=player.position;
 if(!paused)for(const c of chunks){c.position.z+=v*dt;if(c.position.z>L+14){c.position.z=Math.min(...chunks.map(k=>k.position.z))-L;build(c)}}
 if(run){
  elapsed+=dt;speed=Math.min(36,17+elapsed*.2);score+=dt*speed*.8;magT=Math.max(0,magT-dt);
  p.x=THREE.MathUtils.lerp(p.x,lane*3,.22);
  if(p.y>0||vy>0){vy-=28*dt;p.y+=vy*dt;if(p.y<=0){p.y=0;vy=0;dbl=false;fl=0;land=.2;pv.rotation.x=0;burst(p,4);if(slideQ){slide=.8;slideQ=false}}}
  if(slide>0)slide=Math.max(0,slide-dt);
  blob.position.x=p.x;blob.scale.setScalar(Math.max(.3,1-p.y*.2));
  front+=speed*dt;const pool=elapsed<12?[0,1,2,6,8]:PAT.map((_,i)=>i);
  while(front>-150){const z=front-R([14,18,22])-speed*.3;if(rnd()<.07)pk(rl(),z+9.5,1.25,'m');front=z-PAT[R(pool)](z)}
  for(let i=obs.length-1;i>=0;i--){const o=obs[i],g=o.g;g.position.z+=speed*dt;if(o.vx&&g.position.z>-45)g.position.x+=o.vx*dt;if(g.position.z>16){scene.remove(g);obs.splice(i,1);continue}
   if(Math.abs(g.position.x-p.x)<(o.t==='mov'?2.45:1.1)&&Math.abs(g.position.z-3)<o.d/2+.35){const y=p.y,ok={low:y>.75,crate:y>1.35,mov:y>1.55,over:slide>0}[o.t];if(!ok){end();break}}}
  for(let i=picks.length-1;i>=0;i--){const c=picks[i],q=c.m.position;q.z+=speed*dt;c.m.rotation.y+=dt*4;
   if(c.k==='c'&&magT>0&&Math.abs(3-q.z)<9&&Math.abs(p.x-q.x)<6){q.x+=(p.x-q.x)*Math.min(1,dt*7);q.y+=(1.3-q.y)*Math.min(1,dt*5)}
   if(q.z>12){scene.remove(c.m);picks.splice(i,1);continue}
   if(Math.abs(q.z-3)<.9&&Math.abs(q.x-p.x)<1.1&&Math.abs(q.y-(p.y+(slide>0?.5:1.25)))<1.1){
    if(c.k==='c'){coins++;score+=10;combo=now-lastPick<900?Math.min(combo+1,8):0;lastPick=now;sfx(660+combo*70)}
    else if(c.k==='g'){coins+=5;score+=50;sfx(1200,.2)}else{magT=8;say(I('magnet'),1500);sfx(500,.25)}
    burst(q,c.k==='c'?5:12);scene.remove(c.m);picks.splice(i,1)}}
  dayNight(T.fix??(elapsed/80)%1);camera.fov=62+(speed-17)*.5;camera.updateProjectionMatrix();updateHud()}
 for(const q of parts)if(q.l>0){q.l-=dt;q.v.y-=12*dt;q.m.position.addScaledVector(q.v,dt);q.m.position.z+=v*dt;if(q.l<=0)q.m.visible=false}
 // ---- animasyon
 if(!paused&&rig){ph+=dt*(run?speed:6)*.55;land=Math.max(0,land-dt);const s=Math.sin(ph),c=Math.cos(ph),Lp=THREE.MathUtils.lerp;
  rig.rotation.y=0;pv.rotation.z=0;
  if(dead){pv.rotation.x=Math.min(1.4,pv.rotation.x+dt*6);pv.position.y=Lp(pv.position.y,.4,.2);set(Q.lL,.5,-.4);set(Q.lR,-.3,-.8);set(Q.aL,2.4,.2);set(Q.aR,-.6,.4)}
  else if(slide>0){pv.rotation.x=Lp(pv.rotation.x,1.25,.35);pv.position.y=Lp(pv.position.y,.45,.35);set(Q.lL,.15,0);set(Q.lR,.05,0);set(Q.aL,1.1,.3);set(Q.aR,1.3,.3)}
  else if(p.y>0){if(fl>0&&fl<6.28)fl+=dt*10;pv.rotation.x=fl>0?-fl:-.1;pv.position.y=1.2;set(Q.lL,.9,-1.2);set(Q.lR,-.3,-.6);set(Q.aL,2.3,.3);set(Q.aR,2.1,.3)}
  else{pv.rotation.x=Lp(pv.rotation.x,-.14,.3);pv.position.y=1.2+Math.abs(s)*.07-land*.5;pv.rotation.z=-(lane*3-p.x)*.1;rig.rotation.y=s*.12;set(Q.lL,s*.85,-Math.max(0,c)*1.3);set(Q.lR,-s*.85,-Math.max(0,-c)*1.3);set(Q.aL,-s*.8,1.1);set(Q.aR,s*.8,1.1)}
  if(Q.cape)Q.cape.rotation.x=.35+Math.sin(ph*1.7)*.2+(p.y>0?.3:0)}
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,p.x*.35,.05);camera.lookAt(p.x*.25,1.3,-7);
 renderer.render(scene,camera)}
applyLang();applyTheme();buildPlayer();
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
